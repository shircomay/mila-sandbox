# Fork-only: build an installable, ad-hoc-signed DMG of the personal Mila build.
# Triggered by hand or by pushing a tag like `fork-v1`. Nothing is published to
# upstream, notarized, or added to a Sparkle appcast (SUFeedURL is untouched; the
# personal build has the updater switched off, see Mila/App/ForkBuild.swift).
#
# What `make dmg` needs, and how this job provides it:
#   - Xcode + xcodegen            -> macos-26 image, `brew install xcodegen`
#   - Mila/Resources/PythonRuntime (bundled diarization runtime, gitignored)
#                                 -> same cache + `make bundle-diarization` as Fork CI
#   - generated Xcode project     -> `make dmg` depends on `make project`
#   - signing identity            -> CODESIGN_IDENTITY=- (ad-hoc); no secrets needed
#   - VERSION                     -> MARKETING_VERSION from project.yml + "-<suffix>"
# The release-notes gate belongs to upstream's private pipeline and is not run.
name: Fork release

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Suffix appended to MARKETING_VERSION in the DMG name'
        default: 'fork'
        required: false
  push:
    tags: ['fork-v*']

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write   # only used to create a GitHub Release on fork-v* tags
    env:
      INPUT_SUFFIX: ${{ inputs.version_suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          suffix="${INPUT_SUFFIX:-fork}"
          if ! [[ "$suffix" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Invalid version suffix '$suffix'"; exit 1
          fi
          marketing=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^" ]*\)"\{0,1\}.*$/\1/p' project.yml | head -n 1)
          if [ -z "$marketing" ]; then echo "::error::MARKETING_VERSION not found in project.yml"; exit 1; fi
          echo "version=$marketing-$suffix" >> "$GITHUB_OUTPUT"
          echo "DMG version: $marketing-$suffix"

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache diarization bundle
        id: diar-bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Mila/Resources/PythonRuntime
          key: diar-bundle-${{ runner.os }}-${{ hashFiles('scripts/build-diarization-bundle.sh') }}

      - name: Build diarization bundle (cold path only)
        if: steps.diar-bundle-cache.outputs.cache-hit != 'true'
        run: make bundle-diarization

      - name: Build DMG (ad-hoc signed)
        env:
          CODESIGN_IDENTITY: '-'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          make dmg VERSION="$VERSION" 2>&1 | tee /tmp/dmg-build.log
          ls -lh "Mila-$VERSION.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mila-${{ steps.version.outputs.version }}-dmg
          path: Mila-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-release-log
          path: /tmp/dmg-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach DMG to a GitHub Release (fork-v* tags only)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "Mila-$VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Personal Mila build $TAG" \
            --notes "Ad-hoc-signed personal build ($VERSION). First launch: right-click, Open. Re-grant Microphone and Screen Recording after installing. See FORK.md."
